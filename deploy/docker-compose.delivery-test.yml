services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery_test
      POSTGRES_USER: delivery_test
      POSTGRES_PASSWORD: delivery_test
    ports:
      - "127.0.0.1:${DELIVERY_TEST_POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_test -d delivery_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: delivery_test
      RABBITMQ_DEFAULT_PASS: delivery_test
    ports:
      - "127.0.0.1:${DELIVERY_TEST_RABBITMQ_PORT:-25672}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Run as the broker UID: root diagnostics can create an unreadable Erlang cookie during startup.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  rabbitmq-data:
