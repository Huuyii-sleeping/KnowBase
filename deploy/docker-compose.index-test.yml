services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    ports:
      - "127.0.0.1::9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 45

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/index-test-password
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1::7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p index-test-password 'RETURN 1' >/dev/null"]
      interval: 2s
      timeout: 10s
      retries: 45
