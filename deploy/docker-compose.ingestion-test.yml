services:
  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1::27017'
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /data/db
    volumes:
      - ./mongodb:/schema:ro
  object-storage:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ingestion-test
      MINIO_ROOT_PASSWORD: ingestion-test-password
    ports:
      - '127.0.0.1::9000'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30
