services:
  postgres:
    image: postgres:16-alpine
    container_name: knowbase-postgres
    environment:
      POSTGRES_DB: knowbase
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase -d knowbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: knowbase-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: knowbase
      MONGO_INITDB_ROOT_PASSWORD: knowbase
      MONGO_INITDB_DATABASE: knowbase
    ports:
      - "17017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/knowbase | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: knowbase-rustfs
    environment:
      RUSTFS_ACCESS_KEY: knowbaseadmin
      RUSTFS_SECRET_KEY: knowbaseadmin
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - rustfs-data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: knowbase-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: knowbase
      RABBITMQ_DEFAULT_PASS: knowbase
    ports:
      - "15672:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: knowbase-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: knowbase-neo4j
    environment:
      NEO4J_AUTH: neo4j/knowbase
    ports:
      - "17687:7687"
      - "17474:7474"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p knowbase 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  langfuse-web:
    image: langfuse/langfuse:4
    container_name: knowbase-langfuse-web
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "13000:3000"
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:13000
      DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/postgres
      SALT: knowbase-langfuse-salt
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXTAUTH_SECRET: knowbase-langfuse-nextauth-secret
      TELEMETRY_ENABLED: "false"
      LANGFUSE_MIGRATION_V4_WRITE_MODE: dual
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: myredissecret
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: knowbase
      LANGFUSE_INIT_ORG_NAME: KnowBase
      LANGFUSE_INIT_PROJECT_ID: knowbase
      LANGFUSE_INIT_PROJECT_NAME: KnowBase Local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local
      LANGFUSE_INIT_USER_EMAIL: admin@knowbase.local
      LANGFUSE_INIT_USER_NAME: KnowBase Admin
      LANGFUSE_INIT_USER_PASSWORD: knowbase-admin

  langfuse-worker:
    image: langfuse/langfuse-worker:4
    container_name: knowbase-langfuse-worker
    depends_on: *langfuse-depends-on
    ports:
      - "13030:3030"
    environment: *langfuse-env

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: knowbase-langfuse-clickhouse
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "18123:8123"
      - "19090:9000"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: minio/minio:latest
    container_name: knowbase-langfuse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "19092:9000"
      - "19093:9001"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-minio-init:
    image: minio/mc:latest
    container_name: knowbase-langfuse-minio-init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://langfuse-minio:9000 minio miniosecret
        && mc mb --ignore-existing local/langfuse

  langfuse-redis:
    image: redis:7-alpine
    container_name: knowbase-langfuse-redis
    command: ["redis-server", "--requirepass", "myredissecret", "--maxmemory-policy", "noeviction"]
    ports:
      - "16379:6379"
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myredissecret", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    image: postgres:17-alpine
    container_name: knowbase-langfuse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15433:5432"
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  mongodb-data:
  rustfs-data:
  rabbitmq-data:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
  langfuse-postgres-data:
