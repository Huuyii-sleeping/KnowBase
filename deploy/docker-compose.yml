services:
  postgres:
    image: postgres:16-alpine
    container_name: knowbase-postgres
    environment:
      POSTGRES_DB: knowbase
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase -d knowbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: knowbase-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: knowbase
      MONGO_INITDB_ROOT_PASSWORD: knowbase
      MONGO_INITDB_DATABASE: knowbase
    ports:
      - "17017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/knowbase | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: knowbase-rustfs
    environment:
      RUSTFS_ACCESS_KEY: knowbaseadmin
      RUSTFS_SECRET_KEY: knowbaseadmin
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - rustfs-data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: knowbase-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: knowbase
      RABBITMQ_DEFAULT_PASS: knowbase
    ports:
      - "15672:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: knowbase-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: knowbase-neo4j
    environment:
      NEO4J_AUTH: neo4j/knowbase
    ports:
      - "17687:7687"
      - "17474:7474"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p knowbase 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  postgres-data:
  mongodb-data:
  rustfs-data:
  rabbitmq-data:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
